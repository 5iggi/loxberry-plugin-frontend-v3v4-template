<div class="lb-content plugin-page">

  <section class="lb-card plugin-card plugin-hero-card">
    <div class="plugin-actions plugin-actions-top">
      <a class="lb-btn plugin-button" data-role="none" href="javascript:restartService();"><i class="pi pi-refresh"></i><span>Restart</span></a>
      <a class="lb-btn plugin-button plugin-button-danger" data-role="none" href="javascript:stopService();"><i class="pi pi-stop-circle"></i><span>Stop</span></a>
      <a class="lb-btn plugin-button" data-role="none" href="/admin/system/tools/logfile.cgi?logfile=plugins/PLUGINNAME/PLUGINNAME.log&amp;header=html&amp;format=template" target="plugin_log"><i class="pi pi-file"></i><span>Log anzeigen</span></a>
    </div>

    <h2>PLUGINNAME</h2>
    <p class="plugin-muted">v3/v4-kompatibles Frontend mit eigenen Tokens und Fallbacks.</p>
  </section>

  <section class="lb-card plugin-card">
    <h3><i class="pi pi-cog"></i> Demo-Einstellungen</h3>

    <form method="post" action="" data-role="none">
      <div class="plugin-grid-2">
        <div class="plugin-field lb-form-row">
          <label class="lb-form-label" for="setting1">Einstellung 1</label>
          <div class="lb-form-field">
            <input class="lb-input" data-role="none" type="text" name="setting1" id="setting1" value="<TMPL_VAR setting1>">
            <div class="plugin-help">Kurzer Hilfetext für ein Textfeld.</div>
          </div>
        </div>

        <div class="plugin-field lb-form-row">
          <label class="lb-form-label" for="setting2">Einstellung 2</label>
          <div class="lb-form-field">
            <input class="lb-input" data-role="none" type="password" name="setting2" id="setting2" value="<TMPL_VAR setting2>">
            <div class="plugin-help">Beispiel für ein Passwortfeld.</div>
          </div>
        </div>
      </div>

      <div class="plugin-grid-2">
        <div class="plugin-field lb-form-row">
          <label class="lb-form-label" for="select1">Auswahl</label>
          <div class="lb-form-field">
            <select class="lb-input" data-role="none" name="select1" id="select1">
              <option>Option A</option>
              <option>Option B</option>
            </select>
          </div>
        </div>

        <div class="plugin-field lb-form-row">
          <label class="lb-form-label" for="number1">Nummer</label>
          <div class="lb-form-field">
            <input class="lb-input" data-role="none" type="number" name="number1" id="number1" value="100">
          </div>
        </div>
      </div>

      <div class="plugin-actions">
        <button type="submit" name="save" value="1" class="lb-btn lb-btn-primary plugin-button plugin-button-primary" data-role="none"><i class="pi pi-check"></i><span>Speichern</span></button>
      </div>
    </form>

    <div class="plugin-status plugin-muted"><TMPL_VAR notice></div>
  </section>

</div>
